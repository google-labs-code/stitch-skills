name: Validate Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  validate-helper-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24.x'
    - name: Verify helper script regressions
      run: find plugins -name '*.test.mjs' -print0 | xargs -0 node --test

  validate-stitch-to-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/stitch-build/skills/react-components

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: plugins/stitch-build/skills/react-components/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify Gold Standard Example
      run: node scripts/validate.js examples/gold-standard-card.tsx

    - name: Verify validator regressions
      run: npm test

  validate-stitch-to-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/stitch-build/skills/react-native

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: plugins/stitch-build/skills/react-native/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify Gold Standard Example
      run: node scripts/validate.js examples/gold-standard-card.tsx

    - name: Verify native validator regressions
      run: npm test
