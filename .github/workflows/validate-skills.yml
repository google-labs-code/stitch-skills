name: Validate Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-documented-skill-names:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
      with:
        node-version: '18.x'

    - name: Verify install snippets use declared skill names
      run: node .github/scripts/check-documented-skill-names.mjs

  validate-stitch-to-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/stitch-build/skills/react-components

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: plugins/stitch-build/skills/react-components/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify Gold Standard Example
      run: node scripts/validate.js examples/gold-standard-card.tsx

  validate-stitch-to-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/stitch-build/skills/react-native

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: plugins/stitch-build/skills/react-native/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify Gold Standard Example
      run: node scripts/validate.js examples/gold-standard-card.tsx
